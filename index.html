<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#613087">
<title>Hồ sơ minh chứng</title>
<style>
/* Màu thương hiệu Hoàng Tuấn theo logo: tím #613087, cam #F37E21 */
:root{
  --bg:#faf8fc;--panel:#ffffff;--ink:#262234;--muted:#4a4658;--line:#e3deea;
  --accent:#613087;--accent-ink:#ffffff;--soft:#f3eff8;--mark:#ffd7a8;--err:#b3261e;--stage:#e6e1ee;
  --fill:#613087;--fill-fg:#ffffff;--orange:#f37e21;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121016;--panel:#1a1720;--ink:#ebe7f1;--muted:#b3a9c2;--line:#352e40;
  --accent:#b79ad6;--accent-ink:#1a1026;--soft:#28223a;--mark:#7a4a16;--err:#f08a8f;--stage:#0d0b11;
  --fill:#4a2a66;--fill-fg:#f3edf9;--orange:#f79a4e;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input{font:inherit;color:inherit}
a{color:var(--accent)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--orange);outline-offset:1px}

/* Cổng mật khẩu */
#gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
#gate form{width:min(400px,100%);background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--orange);border-radius:10px;padding:28px 24px}
#gate h1{font-size:21px;margin:0 0 6px;color:var(--accent)}
#gate p{margin:0 0 18px;color:var(--muted)}
#gate label{display:block;font-weight:600;margin-bottom:6px}
#gate input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
#gate button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
#gate button:disabled{opacity:.65;cursor:progress}
#gate-msg{min-height:22px;margin-top:10px;color:var(--err);font-size:14px}

/* Khung đọc */
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto auto 1fr;grid-template-columns:350px minmax(0,1fr);grid-template-areas:"head head" "side ctx" "side view"}
#head{grid-area:head;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--fill);color:var(--fill-fg);border-bottom:3px solid var(--orange)}
#head h1{font-size:15px;font-weight:650;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{min-width:36px;height:36px;padding:0 9px;border:1px solid rgba(255,255,255,.4);border-radius:7px;background:transparent;color:var(--fill-fg);cursor:pointer}
.ib:hover{background:rgba(255,255,255,.16)}
#menu{display:none}
.pager{display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--fill-fg)}
.pager input{width:62px;height:36px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}

#side{grid-area:side;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
#tabs{display:flex;border-bottom:1px solid var(--line)}
#tabs button{flex:1;padding:11px 3px;font-size:14px;line-height:1.25;border:0;border-bottom:3px solid transparent;background:none;cursor:pointer;color:var(--muted);font-weight:600}
#tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--orange)}
.panel{flex:1;min-height:0;overflow:auto;padding:8px 16px 24px 8px}

/* Mục lục */
.t{display:flex;align-items:flex-start;border-radius:6px}
.t a{flex:1;min-width:0;padding:6px 6px;text-decoration:none;color:inherit;display:flex;gap:8px;justify-content:space-between;cursor:pointer}
.t a span.pn{color:var(--muted);font-size:12.5px;flex:none;padding-top:1px}
.t:hover{background:var(--soft)}
.t.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--orange)}
.t.on a{font-weight:600;color:var(--accent)}
.t button{flex:none;width:26px;height:30px;border:0;background:none;cursor:pointer;color:var(--muted)}
.t .sp{flex:none;width:26px}
.l1>.t a{font-weight:650}
.kids{margin-left:12px}
.l3 .t a{font-size:13.5px}

/* Bài báo */
.arts-note{padding:6px 6px 10px;color:var(--muted);font-size:13.5px}
.arts-h{font-weight:700;margin:14px 6px 6px;color:var(--accent)}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;scroll-margin-top:8px}
.card.on{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--orange)}
.card .tt{font-weight:600;font-size:14px}
.card .mt{color:var(--muted);font-size:13px;margin-top:3px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{display:inline-flex;align-items:center;min-height:32px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:transparent;text-decoration:none;color:var(--ink);font-size:13px;cursor:pointer}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{opacity:.9;background:var(--accent)}
.btn:disabled{opacity:.6;cursor:progress}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:4px 8px;font-size:13px;color:var(--muted)}
.fn{color:var(--muted);font-size:12px;margin-top:6px;overflow-wrap:anywhere}

/* Tìm kiếm */
#q{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
#q-info{color:var(--muted);font-size:13px;margin:8px 4px}
.hit{display:block;width:100%;text-align:left;padding:8px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.hit:hover{background:var(--soft)}
.hit b{display:block;font-size:13px}
.hit span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
mark{background:var(--mark);color:inherit;border-radius:2px}

/* Thanh ngữ cảnh + trang */
#ctx{grid-area:ctx;min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:44px}
#ctx .lbl{flex:1 1 280px;min-width:0;font-size:13.5px}
#ctx .lbl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ctx .lbl small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
#ctx .acts{margin:0}
#view{grid-area:view;overflow:auto;background:var(--stage);min-width:0;min-height:0;padding:4px 0}
#pages{min-width:100%;display:inline-block}
.pg{position:relative;width:var(--pw,800px);margin:8px auto;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.28);scroll-margin-top:4px}
.pg img{display:block;width:100%;height:100%}
.pg .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7b858c;font-size:14px;background:#fff}
.pg .ph button{border:1px solid #bbb;background:#f5f5f5;color:#333;border-radius:6px;padding:6px 10px;cursor:pointer}
#scrim{display:none}

/* Quy định PGS */
#app.reg #view,#app.reg #ctx{display:none}
#reg{grid-area:view;overflow:auto;min-width:0;min-height:0;background:var(--bg);padding:20px 24px 48px}
#reg .wrap{max-width:1080px;margin:0 auto}
#reg h2{font-size:22px;margin:0 0 4px;color:var(--accent)}
#reg h3{font-size:17px;margin:30px 0 4px;color:var(--accent);scroll-margin-top:12px}
#reg h4{font-size:14.5px;margin:18px 0 8px;scroll-margin-top:12px}
#reg .lead{color:var(--muted);margin:0 0 14px;font-size:14px}
#reg .lead a{font-weight:600}
.alerts{display:grid;gap:8px;margin-top:10px}
.alert{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:8px;padding:10px 12px}
.alert b{display:block;font-size:14px}
.alert span{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;scroll-margin-top:12px}
.doc .tt{font-weight:600;font-size:14px}
.doc .mt{color:var(--muted);font-size:13px;margin-top:3px}
.doc .acts{margin-top:auto;padding-top:8px}
.rfilter{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.rfilter input{flex:1 1 240px;min-width:0;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.rfilter button{min-height:34px;padding:4px 11px;border:1px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;font-size:13px}
.rfilter button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
#rcount{color:var(--muted);font-size:13px;margin:0 0 6px}
table.jt{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13.5px}
.jt th{background:var(--soft);color:var(--accent);text-align:left;font-size:12.5px;padding:8px;border-bottom:1px solid var(--line)}
.jt td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.jt tr:last-child td{border-bottom:0}
.jt .no{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.jt .nm{font-weight:600}
.jt .sm{color:var(--muted);font-size:12.5px;margin-top:2px}
.jt .hd{font-size:13px}
.jt .hd+.hd{margin-top:5px}
.jt .pt{white-space:nowrap;font-weight:600}
.jt .acts{margin:0;flex-direction:column;align-items:flex-start}
.jt .acts .btn,.jt .acts .chip{min-height:30px;font-size:12.5px;white-space:nowrap}
.jt td:last-child{width:196px}
.jt td.no{width:64px}
.jt td:nth-child(3){width:30%}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;margin:3px 4px 0 0;white-space:nowrap}
.tag.ok{background:#e1f5ea;color:#0b6b3a}
.tag.chk{background:#ffe6cb;color:#8a4207}
.tag.no{background:#fde2e1;color:#9b1c1c}
.tag.me{background:var(--soft);color:var(--accent);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){.tag.ok{background:#12301f;color:#63d6a0}.tag.chk{background:#3a2716;color:#f0a868}.tag.no{background:#3a1717;color:#f3a3a3}}
.rnav a{display:block;padding:7px 8px;border-radius:6px;cursor:pointer;text-decoration:none;color:inherit}
.rnav a:hover{background:var(--soft)}
.rnav a.sub{padding-left:22px;font-size:13.5px;color:var(--muted)}
.rnav .open{margin:4px 0 10px}
@media (max-width:820px){
  #reg{padding:14px 12px 40px}
  .jt thead{display:none}
  .jt,.jt tbody,.jt tr,.jt td{display:block;width:100%}
  .jt tr{border-bottom:1px solid var(--line);padding:8px 2px}
  .jt td,.jt td:last-child,.jt td.no,.jt td:nth-child(3){border:0;padding:3px 8px;width:100%}
  .jt .acts{flex-direction:row}
  .jt td[data-l]::before{content:attr(data-l);display:block;font-size:11.5px;color:var(--muted);font-weight:600}
  .jt td.no::before{content:"STT danh mục 2026: "}
}
/* Tiêu chí Hương */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:12px 0}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi .k{font-size:12.5px;color:var(--muted)}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;color:var(--accent);font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.bad{border-left:4px solid var(--err)}.kpi.good{border-left:4px solid #1a8a52}.kpi.warn{border-left:4px solid var(--orange)}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.bar .b1{background:var(--accent)}.bar .b2{background:var(--orange)}.bar .b3{background:#9b86b8}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.opts{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;background:var(--soft);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13.5px}
.opts label{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.opts input[type=date]{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
#sc-body select,#sc-body input[type=number],.scf input,.scf select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font-size:13.5px;max-width:100%}
#sc-body input[type=number]{width:96px}
.scf{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin:8px 0 14px}
.scf label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.scf .wide{grid-column:1/-1}
.scf .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gap{display:grid;gap:8px}
.gap .alert b{font-size:14px}
.tag.pend{background:#e7eefb;color:#1f4f99}
@media (prefers-color-scheme:dark){.tag.pend{background:#1a2740;color:#9dbbf0}}
.jt td.c{white-space:nowrap}
.sc-save{font-size:12.5px;color:var(--muted);margin-left:6px}
.jt.sc td:last-child,.jt.sc td:nth-child(3){width:auto}
.jt.sc td.c{width:56px;color:var(--muted);font-variant-numeric:tabular-nums}
.jt.sc td.r{width:210px}
@media (max-width:820px){.jt.sc td.c,.jt.sc td.r{width:100%}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:40}
#toast a{color:inherit;font-weight:600}

@media (max-width:820px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "ctx" "view"}
  #menu{display:inline-block}
  #head h1{display:none}
  .pager{flex:1;justify-content:center}
  .hide-m{display:none}
  #side{position:fixed;top:0;bottom:0;left:0;width:min(88vw,370px);z-index:30;transform:translateX(-102%);transition:transform .18s ease;border-right:1px solid var(--line)}
  #app.open #side{transform:none}
  #app.open #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  #ctx{padding:6px 10px;min-height:0}
  #ctx .lbl{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){#side{transition:none}}
</style>
</head>
<body>
<div id="gate">
  <form id="gate-f" autocomplete="off">
    <h1>Hồ sơ minh chứng</h1>
    <p>Tài liệu đã được mã hoá. Nhập mật khẩu để xem.</p>
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" autofocus required>
    <button id="gate-b" type="submit">Mở hồ sơ</button>
    <div id="gate-msg" role="alert"></div>
    <noscript>Trang này cần bật JavaScript.</noscript>
  </form>
</div>

<div id="app" hidden>
  <header id="head">
    <button class="ib" id="menu" aria-label="Mở mục lục">☰</button>
    <h1 id="doc-title"></h1>
    <div class="pager">
      <button class="ib" id="prev" aria-label="Trang trước">‹</button>
      <input id="pno" inputmode="numeric" aria-label="Số trang">
      <span>/ <span id="ptotal"></span></span>
      <button class="ib" id="next" aria-label="Trang sau">›</button>
    </div>
    <button class="ib hide-m" id="zo" aria-label="Thu nhỏ">−</button>
    <button class="ib hide-m" id="zi" aria-label="Phóng to">+</button>
    <button class="ib" id="out">Thoát</button>
  </header>
  <div id="scrim"></div>
  <aside id="side">
    <div id="tabs" role="tablist">
      <button role="tab" data-tab="toc" aria-selected="true">Mục lục</button>
      <button role="tab" data-tab="arts" aria-selected="false">Bài báo</button>
      <button role="tab" data-tab="find" aria-selected="false">Tìm kiếm</button>
      <button role="tab" data-tab="reg" aria-selected="false">Quy định PGS</button>
      <button role="tab" data-tab="sc" aria-selected="false">Tiêu chí Hương</button>
    </div>
    <div class="panel rnav" id="tab-reg" hidden></div>
    <div class="panel rnav" id="tab-sc" hidden></div>
    <div class="panel" id="tab-toc"></div>
    <div class="panel" id="tab-arts" hidden></div>
    <div class="panel" id="tab-find" hidden>
      <input id="q" type="search" placeholder="Tìm trong hồ sơ, gõ có hoặc không dấu" aria-label="Tìm trong hồ sơ">
      <div id="q-info"></div>
      <div id="q-res"></div>
    </div>
  </aside>
  <div id="ctx"></div>
  <main id="view"><div id="pages"></div></main>
  <section id="reg" hidden><div class="wrap" id="reg-body"></div><div class="wrap" id="sc-body" hidden></div></section>
</div>
<div id="toast" hidden role="status"></div>

<script>
'use strict';
const $=s=>document.querySelector(s), enc=new TextEncoder(), dec=new TextDecoder();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY=null, M=null, CUR=1, SCALE=1;
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};

async function derive(pw){
  const r=await fetch('s.json',{cache:'no-cache'}); if(!r.ok) throw new Error('net');
  const s=await r.json(), salt=Uint8Array.from(atob(s.s),c=>c.charCodeAt(0));
  const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:s.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function getBin(path){
  const r=await fetch(path); if(!r.ok) throw new Error('net');
  const b=new Uint8Array(await r.arrayBuffer());
  return crypto.subtle.decrypt({name:'AES-GCM',iv:b.subarray(0,12)},KEY,b.subarray(12));
}
async function unlock(key){
  KEY=key;
  M=JSON.parse(dec.decode(await getBin('m.bin')));
  try{const raw=new Uint8Array(await crypto.subtle.exportKey('raw',key));store.set('k',btoa(String.fromCharCode(...raw)))}catch(e){}
  boot();
}
$('#gate-f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=$('#gate-b'),msg=$('#gate-msg');
  if(!window.crypto||!crypto.subtle){msg.textContent='Trình duyệt này không hỗ trợ giải mã. Hãy mở bằng Chrome, Safari hoặc Edge bản mới.';return}
  b.disabled=true;b.textContent='Đang kiểm tra…';msg.textContent='';
  try{await unlock(await derive($('#pw').value))}
  catch(e){
    msg.textContent=(e&&e.message==='net'||e instanceof TypeError)?'Không tải được dữ liệu. Kiểm tra mạng rồi thử lại.':'Mật khẩu chưa đúng.';
    KEY=null;b.disabled=false;b.textContent='Mở hồ sơ';$('#pw').select();
  }
});
(async()=>{
  const k=store.get('k'); if(!k||!window.crypto||!crypto.subtle) return;
  try{
    const raw=Uint8Array.from(atob(k),c=>c.charCodeAt(0));
    await unlock(await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},true,['decrypt']));
  }catch(e){store.del('k');KEY=null}
})();
$('#out').addEventListener('click',()=>{store.del('k');location.hash='';location.reload()});

/* ---------- Trang ---------- */
const state=new Map(), queue=[]; let active=0;
function pump(){
  while(active<6&&queue.length){
    const p=queue.shift(), st=state.get(p);
    if(!st||st.url||st.busy) continue;
    st.busy=true;active++;
    getBin('p/'+String(p).padStart(4,'0')+'.bin').then(buf=>{
      const s=state.get(p);
      if(!s){return}
      s.url=URL.createObjectURL(new Blob([buf],{type:'image/webp'}));
      const el=document.getElementById('p'+p), img=document.createElement('img');
      img.alt='Trang '+p;img.src=s.url;
      img.onload=()=>{const ph=el.querySelector('.ph'); if(ph) ph.remove()};

    }).catch(()=>{
      const el=document.getElementById('p'+p), ph=el&&el.querySelector('.ph');
      if(ph&&state.get(p)) ph.innerHTML='<button data-retry="'+p+'">Không tải được trang '+p+'. Thử lại</button>';
    }).finally(()=>{const s=state.get(p);if(s)s.busy=false;active--;pump()});
  }
}
function want(p){ if(!state.has(p)){state.set(p,{});queue.push(p);pump()} }
function drop(p){
  const s=state.get(p); if(!s) return;

/* ---------- Tiêu chí Hương ---------- */
let SC=null, LOC=null, SCV=false, SCK=null;
const LKEY='sc-loc-v1';
const ROLE_MAIN=['Tác giả thứ nhất','Tác giả liên hệ','Tác giả thứ nhất, tác giả liên hệ','Tác giả duy nhất'];
function blankLoc(){return {add:{pubs:[],books:[],sup:[]},ov:{},teach:{},prog:{},comp:{},gen:{},opt:{strict:false,field:false},deadline:null,at:null}}
async function scKey(){
  if(SCK) return SCK;
  const k=store.get('k'); if(!k) return null;
  try{SCK=await crypto.subtle.importKey('raw',Uint8Array.from(atob(k),c=>c.charCodeAt(0)),{name:'AES-GCM'},false,['encrypt','decrypt'])}catch(e){SCK=null}
  return SCK;
}
async function loadLoc(){
  LOC=blankLoc();
  let s=null; try{s=localStorage.getItem(LKEY)}catch(e){}
  if(!s) return;
  try{
    const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));
    const o=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.subarray(0,12)},KEY,b.subarray(12))));
    LOC=Object.assign(blankLoc(),o);LOC.add=Object.assign({pubs:[],books:[],sup:[]},o.add||{});LOC.opt=Object.assign({strict:false,field:false},o.opt||{});
  }catch(e){LOC=blankLoc()}
}
async function saveLoc(){
  LOC.at=new Date().toISOString();
  const k=await scKey(), m=$('#sc-saved');
  if(!k){if(m)m.textContent='Không lưu được trên trình duyệt này; hãy dùng nút Xuất dữ liệu.';return}
  try{
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,enc.encode(JSON.stringify(LOC))));
    const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);
    let bin='';for(let i=0;i<all.length;i+=8192)bin+=String.fromCharCode(...all.subarray(i,i+8192));
    localStorage.setItem(LKEY,btoa(bin));
    if(m)m.textContent='Đã lưu trên máy này lúc '+new Date().toLocaleTimeString('vi-VN');
  }catch(e){if(m)m.textContent='Không lưu được trên trình duyệt này; hãy dùng nút Xuất dữ liệu.'}
}
function isNNDS(j){const s=nfs(j||'');return /doi song/.test(s)||/0868 3409/.test(s)}
function pubs(){return SC.pubs.map(p=>Object.assign({},p,LOC.ov['p:'+p.n]||{})).concat(LOC.add.pubs.map(p=>Object.assign({user:1},p)))}
function books(){return SC.books.map(b=>Object.assign({},b,LOC.ov['b:'+b.id]||{})).concat(LOC.add.books.map(b=>Object.assign({user:1},b)))}
function sups(){return SC.sup.map(s=>Object.assign({},s,LOC.ov['s:'+s.id]||{})).concat(LOC.add.sup.map(s=>Object.assign({user:1},s)))}
/* Lý do tính hoặc không tính loại 1, theo PL I mục III. ignoreSt: tính thử khi bài đã đăng */
function judge(p,ignoreSt){
  const o=LOC.opt;
  if(!ignoreSt&&p.st!=='pub') return {c:false,t:'pend',why:'Đang chờ đăng; sẽ tính khi có số xuất bản'};
  if(p.main===false) return {c:false,t:'no',why:p.role==='Cần xác nhận'?'Chưa rõ vai trò tác giả':'Đồng tác giả, không phải tác giả chính'};
  if(p.main==='cond') return {c:false,t:'chk',why:'Chờ bản in ghi tác giả liên hệ'};
  if(p.kind==='proc'&&!p.scopus) return {c:false,t:'no',why:'Kỷ yếu không thuộc WoS/Scopus'};
  if(p.kind==='dom'&&!p.l1j) return {c:false,t:'no',why:'Tạp chí không có mức tối đa 1,0 điểm trong danh mục HĐGS 2025'};
  if(p.kind==='dom'&&p.nnds&&o.strict) return {c:false,t:'no',why:'Kịch bản khắt khe: NNĐS không còn là loại 1'};

function bookSub(b){return b.role==='chu'?2:1}
function deadlineDate(){return LOC.deadline||SC.deadline}
function compute(){
  const P=pubs(), B=books(), S=sups();
  let intl=0,dom=0,procI=0,pi=0,pd=0;
  P.forEach(p=>{const j=judge(p);p.jd=j;
    if(j.c){if(p.kind==='proc')procI++;else if(j.intl)intl++;else dom++}
    else if(p.st!=='pub'){const k=judge(p,true);p.jdp=k;if(k.c){k.intl?pi++:pd++}}});
  const procCap=Math.floor(SC.req.intl/3); const procUsed=Math.min(procI,procCap);
  const intlAll=intl+procUsed;
  const bsub=B.filter(b=>b.st==='pub').reduce((s,b)=>s+bookSub(b),0);
  const bpend=B.filter(b=>b.st!=='pub').reduce((s,b)=>s+bookSub(b),0);
  const l1=intlAll+dom+bsub;
  const supW=S.filter(s=>s.st==='qd'||s.st==='xn').reduce((t,s)=>t+(s.role==='chinh'?1:.5),0);
  const supP=S.filter(s=>s.st==='bv').reduce((t,s)=>t+(s.role==='chinh'?1:.5),0);
  const th=SC.teach.map(t=>{const v=LOC.teach[t.y];return {y:t.y,h:v==null||v===''?null:+v}});
  const n180=th.filter(t=>t.h!=null&&t.h>=180).length, n90=th.filter(t=>t.h!=null&&t.h>=90).length, nfill=th.filter(t=>t.h!=null).length;
  const teachOk=n180>=3||n90>=6;
  const prog=SC.prog.map(g=>Object.assign({},g,LOC.prog[g.id]!=null?{ok:LOC.prog[g.id]}:{}));
  const progOk=prog.some(g=>g.ok);
  const phd=new Date(SC.phd), dl=new Date(deadlineDate()), p3=new Date(phd);p3.setFullYear(p3.getFullYear()+3);
  const phdOk=dl>=p3;
  return {P,B,S,intl,intlAll,dom,procI,procUsed,bsub,bpend,l1,pi,pd,supW,supP,th,n180,n90,nfill,teachOk,prog,progOk,phdOk,p3,dl};
}

function readiness(){
  const lv=c=>LOC.comp[c.id]!=null?+LOC.comp[c.id]:c.lv;
  const W={1:30,2:30,3:20}; let tot=0,tw=0; const per={};
  [1,2,3].forEach(s=>{const cs=SC.comp.filter(c=>c.std===s);const w=cs.reduce((a,c)=>a+c.w,0);
    const v=cs.reduce((a,c)=>a+c.w*lv(c)/2,0)/w;per[s]=v;tot+=W[s]*v;tw+=W[s]});
  return {tot:tot/tw,per,lv};

  if(p.main==='cond') acts+='<button class="btn" data-scp="'+esc(p.n)+'" data-f="main" data-v="1">Đã có bản in</button>';
  if(p.role==='Cần xác nhận') acts+='<button class="btn" data-scp="'+esc(p.n)+'" data-f="main" data-v="1">Là tác giả chính</button>';
  if(p.user) acts+='<button class="btn" data-scdel="pubs:'+esc(p.n)+'">Xoá</button>';
  const kindL=p.kind==='intl'?'Quốc tế'+(p.q?' '+p.q:''):p.kind==='dom'?'Trong nước':'Kỷ yếu'+(p.scopus?' Scopus':'');
  return '<tr><td class="c">['+esc(p.n)+']</td><td data-l="Công bố"><div class="nm">'+esc(p.t)+'</div><div class="sm">'+esc(p.j)+' · '+kindL+(p.nnds?' · NNĐS':'')+'</div>'+(p.note?'<div class="sm">'+esc(p.note)+'</div>':'')+'</td>'+
    '<td data-l="Vai trò, ngày">'+esc(p.role)+'<div class="sm">'+esc(p.date||'')+'</div></td>'+
    '<td data-l="Tính loại 1" class="r">'+T(k,p.st!=='pub'?(p.jdp&&p.jdp.c?'Chờ đăng, sẽ tính':'Chờ đăng, không tính'):j.c?'Tính':'Không tính')+'<div class="sm">'+esc(p.st!=='pub'&&p.jdp&&!p.jdp.c?p.jdp.why:j.why)+'</div>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</td></tr>';
}
function gaps(R0){
  const g=[], need=SC.req.l1-R0.l1;
  if(need>0){
    let w='Đang chờ đăng có '+(R0.pi+R0.pd)+' bài sẽ được tính khi ra số. ';
    if(R0.bpend) w+='Xuất bản sách chuyên khảo đang chờ thay thêm được tối đa '+R0.bpend+' công bố. ';
    const tot=R0.l1+R0.pi+R0.pd+R0.bpend;
    w+=tot>=SC.req.l1?'Nếu tất cả về đích thì đạt '+tot+'/12.':'Kể cả khi tất cả về đích vẫn chỉ đạt '+tot+'/12; cần viết thêm '+(SC.req.l1-tot)+' bài là tác giả chính.';
    g.push(['Thiếu '+need+' công bố loại 1 là tác giả chính',w]);
  }
  if(R0.intlAll<SC.req.intl) g.push(['Thiếu '+(SC.req.intl-R0.intlAll)+' công bố quốc tế uy tín','Ưu tiên các bài WoS/Scopus là tác giả thứ nhất hoặc liên hệ.']);
  if(!R0.teachOk) g.push([R0.nfill?'Giờ giảng chưa đạt':'Chưa có số liệu giờ giảng','Cần 3 năm mỗi năm 180 giờ hoặc 6 năm mỗi năm 90 giờ trực tiếp. Xin xác nhận của Học viện Quân y, điền bảng B.2 Mẫu 01.']);
  if(R0.supW<2) g.push(['Chưa đủ 2 suất hướng dẫn thạc sĩ','Hiện có '+nn(R0.supW)+' suất.']);
  if(!R0.progOk) g.push(['Thiếu minh chứng phát triển chương trình','Xin văn bản đưa chương trình (QĐ 3222/2020) vào áp dụng, hoặc xác nhận học phần mới đã dùng cho đào tạo đại học.']);
  if(!R0.phdOk) g.push(['Chưa đủ 3 năm từ ngày cấp bằng TS','Đủ từ '+fmtD(R0.p3)+'.']);
  const cond=R0.P.filter(p=>p.main==='cond'); if(cond.length) g.push(['Chờ bản in xác nhận tác giả liên hệ: '+cond.map(p=>'['+p.n+']').join(', '),'Có bản in thì bấm “Đã có bản in” để tính thêm.']);
  const nn2=R0.P.filter(p=>p.jd.c&&p.nnds).length;
  if(nn2&&!LOC.opt.strict) g.push(['Rủi ro: '+nn2+' bài NNĐS đang được tính','NNĐS không có trong danh mục Bộ KH&CN 2026. Nếu kết quả xếp loại ra trước hạn nộp mà NNĐS không đạt loại 1 thì các bài này mất. Bật “Kịch bản khắt khe” để xem.']);
  const fr=R0.P.filter(p=>p.jd.c&&p.risk==='field').length;
  if(fr&&!LOC.opt.field) g.push(['Rủi ro phù hợp ngành: '+fr+' bài đang tính','Nội dung thiên về giáo dục học; hội đồng xét theo nội dung (Điều 11.2).']);
  const r=readiness(); SC.comp.filter(c=>r.lv(c)===0).forEach(c=>g.push(['Năng lực '+c.id+' chưa có minh chứng: '+c.name,c.need]));
  if(!g.length) g.push(['Đã đủ yêu cầu tối thiểu','Tiếp tục hoàn thiện minh chứng năng lực.']);
  return g;
}
function scChanged(){const y=$('#reg').scrollTop;buildSc();$('#reg').scrollTop=y;saveLoc()}
function scEvents(){
  const box=$('#sc-body');
  box.addEventListener('change',e=>{
    const t=e.target, d=t.dataset;
    if(d.sco){if(d.sco==='deadline')LOC.deadline=t.value||null;else LOC.opt[d.sco]=t.checked}
    else if(d.scs){const [ty,id]=d.scs.split(/:(.*)/);if(d.u){const it=LOC.add[d.u].find(x=>x.id===id);if(it)it[d.f]=t.value}else{LOC.ov[d.scs]=Object.assign(LOC.ov[d.scs]||{},{[d.f]:t.value})}}
    else if(d.sct){LOC.teach[d.sct]=t.value===''?null:Math.max(0,+t.value)}
    else if(d.scg){LOC.prog[d.scg]=t.checked}
    else if(d.scc){LOC.comp[d.scc]=+t.value}
    else if(d.scx){LOC.gen[d.scx]=t.value}
    else if(t.id==='sc-file'){importLoc(t.files[0]);return}
    else return;
    scChanged();
  });
  box.addEventListener('click',e=>{
    const t=e.target.closest('[data-scp],[data-scdel],[data-scx2]'); if(!t) return;
    const d=t.dataset;
    if(d.scp){const n=d.scp, u=LOC.add.pubs.find(x=>String(x.n)===n), v=d.f==='main'?true:d.v;
      if(u) u[d.f]=v; else LOC.ov['p:'+n]=Object.assign(LOC.ov['p:'+n]||{},{[d.f]:v});
      if(d.f==='main'&&!u&&(LOC.ov['p:'+n].role==null)){const b=SC.pubs.find(x=>x.n===n);if(b&&b.role==='Cần xác nhận')LOC.ov['p:'+n].role='Tác giả chính'}
      scChanged()}
    else if(d.scdel){const [ty,id]=d.scdel.split(/:(.*)/);if(!confirm('Xoá mục này khỏi bảng chấm trên máy này?'))return;LOC.add[ty]=LOC.add[ty].filter(x=>String(x.n||x.id)!==id);scChanged()}
    else if(d.scx2==='export'){const b=new Blob([JSON.stringify({kind:'tieu-chi-huong',base:SC.updated,loc:LOC},null,1)],{type:'application/json'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='tieu-chi-huong-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(l);l.click();l.remove()}
    else if(d.scx2==='import'){$('#sc-file').click()}
    else if(d.scx2==='reset'){if(!confirm('Xoá mọi thay đổi đã nhập trên máy này và quay về dữ liệu gốc?'))return;LOC=blankLoc();try{localStorage.removeItem(LKEY)}catch(e){}buildSc()}
  });
  box.addEventListener('submit',e=>{
    const f=e.target.closest('[data-scf]'); if(!f) return; e.preventDefault();
    const v=Object.fromEntries(new FormData(f).entries()), ty=f.dataset.scf, id='U'+Date.now().toString(36);
    if(ty==='pub'){
      const kind=v.kind==='intl'?'intl':v.kind.startsWith('dom')?'dom':'proc';
      LOC.add.pubs.push({n:id,t:v.t.trim(),j:v.j.trim(),kind,scopus:v.kind==='procS',l1j:v.kind==='dom1',nnds:kind==='dom'&&isNNDS(v.j),role:v.role,main:ROLE_MAIN.includes(v.role),st:v.st,date:v.date.trim(),q:v.q,risk:v.risk?'field':'',note:'Thêm trên trang ngày '+new Date().toLocaleDateString('vi-VN')});
    }else if(ty==='books'){LOC.add.books.push({id,t:v.t.trim(),role:v.role,st:v.st,note:'Thêm trên trang'})}
    else if(ty==='sup'){LOC.add.sup.push({id,who:v.who.trim(),role:v.role,st:v.st,note:v.note.trim()})}
    scChanged();toast('Đã thêm và tính lại bảng chấm.',3000);
  });
}
async function importLoc(file){
  if(!file) return;
  try{const o=JSON.parse(await file.text());if(o.kind!=='tieu-chi-huong'||!o.loc) throw 0;
    LOC=Object.assign(blankLoc(),o.loc);LOC.add=Object.assign({pubs:[],books:[],sup:[]},o.loc.add||{});LOC.opt=Object.assign({strict:false,field:false},o.loc.opt||{});
    buildSc();saveLoc();toast('Đã nhập dữ liệu.',3000)}
  catch(e){toast('Tệp không đúng định dạng dữ liệu Tiêu chí Hương.',5000)}
}
function showView(which){
  $('#reg-body').hidden=which!=='reg';$('#sc-body').hidden=which!=='sc';
  if(SCV!==(which==='sc')){SCV=which==='sc';$('#reg').scrollTop=0}
}
async function showSc(){
  setReg(true);showView('sc');
  if(SC) return;
  $('#sc-body').innerHTML='<p class="lead">Đang giải mã dữ liệu…</p>';$('#tab-sc').innerHTML='';
  try{SC=JSON.parse(dec.decode(await getBin('c.bin')));await loadLoc();buildSc();scEvents()}
  catch(e){SC=null;$('#sc-body').innerHTML='<p class="lead">Không tải được dữ liệu. Kiểm tra mạng rồi bấm lại tab Tiêu chí Hương.</p>'}
}

/* ---------- Ngữ cảnh ---------- */
let lastCtx=null;
function setCtx(p){
  const a=M.arts.find(x=>p>=x.start&&p<=x.end), key=a?'a'+a.n:'t'+tocIndexFor(p);
  if(key===lastCtx) return; lastCtx=key;
  const c=$('#ctx');
  document.querySelectorAll('.card.on').forEach(e=>e.classList.remove('on'));
  if(a){
    c.innerHTML='<div class="lbl"><b>['+a.n+'] '+esc(a.title)+'</b><small>'+esc(a.journal)+(a.vol?' · '+esc(a.vol):'')+'</small></div><div class="acts">'+
      (a.orig?'<button class="btn pri" data-orig="'+a.n+'">Mở bài gốc</button>':'')+
      (a.link?'<a class="btn" href="'+esc(a.link.url)+'" target="_blank" rel="noopener noreferrer">'+esc(a.link.label)+' ↗</a>':'<span class="chip">Chưa có link trực tuyến</span>')+'</div>';
    const card=document.getElementById('a'+a.n); card.classList.add('on');
    if(!$('#tab-arts').hidden) card.scrollIntoView({block:'nearest'});
  }else{
    c.innerHTML='<div class="lbl"><b>'+esc(M.toc[tocIndexFor(p)].t)+'</b></div>';
  }
}
function setCur(p,noHash){
  CUR=p;$('#pno').value=p;markToc(p);setCtx(p);
  if(!noHash) history.replaceState(null,'','#p='+p);
}

/* ---------- Tìm kiếm ---------- */
let TEXTS=null, NORM=null, qTimer=null;
function nf(s){let o='';for(const ch of s){let b=ch.toLowerCase();if(b==='đ')b='d';else b=b.normalize('NFD').replace(/[\u0300-\u036f]/g,'');if(b.length!==1||!/[a-z0-9]/.test(b))b=' '.repeat(ch.length);o+=b}return o}
async function runSearch(){
  const q=$('#q').value.trim(), info=$('#q-info'), res=$('#q-res');
  if(q.length<2){info.textContent='';res.innerHTML='';return}
  if(!TEXTS){info.textContent='Đang tải dữ liệu tìm kiếm…';
    try{TEXTS=JSON.parse(dec.decode(await getBin('t.bin')));NORM=TEXTS.map(nf)}catch(e){info.textContent='Không tải được dữ liệu tìm kiếm.';return}}
  const words=nf(q.normalize('NFC')).trim().split(/\s+/).filter(Boolean), exact=[], loose=[];
  if(!words.length){info.textContent='';res.innerHTML='';return}
  const phrase=new RegExp('\\b'+words.join('\\s+')), each=words.map(w=>new RegExp('\\b'+w)), main=each[words.reduce((b,w,i)=>w.length>words[b].length?i:b,0)];
  NORM.forEach((t,i)=>{
    const m=phrase.exec(t);
    if(m) exact.push([i,m.index,m[0].length]);
    else if(words.length>1&&each.every(r=>r.test(t))){const k=main.exec(t);loose.push([i,k.index,k[0].length])}
  });
  const total=exact.length+loose.length, out=exact.concat(loose).slice(0,200);
  info.textContent=total?('Thấy ở '+total+' trang'+(total>200?', hiện 200 trang đầu':'')):'Không thấy kết quả.';
  res.innerHTML=out.map(([i,at,len])=>{
    const s=TEXTS[i],a=Math.max(0,at-60),b=at+len;
    return '<button class="hit" data-goto="'+(i+1)+'"><b>Trang '+(i+1)+' · '+esc(M.toc[tocIndexFor(i+1)].t.slice(0,60))+'</b><span>'+
      (a>0?'…':'')+esc(s.slice(a,at))+'<mark>'+esc(s.slice(at,b))+'</mark>'+esc(s.slice(b,b+80))+'…</span></button>';
  }).join('');
}

/* ---------- Khởi động ---------- */
function boot(){
  $('#gate').hidden=true;$('#app').hidden=false;
  document.title=M.title;$('#doc-title').textContent=M.title;$('#ptotal').textContent=M.n;
  M.tocSorted=M.toc.map((e,i)=>i).sort((a,b)=>M.toc[a].p-M.toc[b].p||a-b);
  const box=$('#pages'), frag=document.createDocumentFragment();
  for(let p=1;p<=M.n;p++){
    const [w,h]=M.sizes[p-1], el=document.createElement('div');
    el.className='pg';el.id='p'+p;el.dataset.p=p;el.style.aspectRatio=w+'/'+h;
    el.innerHTML='<div class="ph">Trang '+p+'</div>';frag.appendChild(el);
  }
  box.appendChild(frag);
  layoutWidth();buildToc();buildArts();
  const view=$('#view');
  const lazy=new IntersectionObserver(es=>es.forEach(e=>{const p=+e.target.dataset.p;e.isIntersecting?want(p):drop(p)}),{root:view,rootMargin:'1400px 0px'});
  const cen=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting) setCur(+e.target.dataset.p)}),{root:view,rootMargin:'-50% 0px -50% 0px'});
  box.querySelectorAll('.pg').forEach(el=>{lazy.observe(el);cen.observe(el)});
  const m=/^#p=(\d+)$/.exec(location.hash);
  jump(m?+m[1]:1,!m);

  document.addEventListener('click',ev=>{
    const t=ev.target.closest('[data-p],[data-goto],[data-orig],[data-dl],[data-tog],[data-retry],[data-tab],[data-rf],[data-rfil],[data-rgo]'); if(!t) return;
    if(t.dataset.tab){
      document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b===t));
      ['toc','arts','find','reg','sc'].forEach(n=>$('#tab-'+n).hidden=n!==t.dataset.tab);
      if(t.dataset.tab==='reg'){showReg();$('#app').classList.remove('open')}
      else if(t.dataset.tab==='sc'){showSc();$('#app').classList.remove('open')}
      else if(REGMODE) setReg(false);
      if(t.dataset.tab==='find') $('#q').focus();
      if(t.dataset.tab==='arts'){const c=$('.card.on'); if(c) c.scrollIntoView({block:'nearest'})}
    }
    else if(t.dataset.rf) openFile(t.dataset.rf,t.dataset.mime,+t.dataset.page||0,t.dataset.dlname||'',t);
    else if(t.dataset.rfil){RF=t.dataset.rfil;document.querySelectorAll('[data-rfil]').forEach(b=>b.setAttribute('aria-pressed',b===t));filterJ()}
    else if(t.dataset.rgo){setReg(true);const e=document.getElementById(t.dataset.rgo);if(e)e.scrollIntoView({block:'start'});$('#app').classList.remove('open')}
    else if(t.dataset.tog){const k=document.getElementById('k'+t.dataset.tog);k.hidden=!k.hidden;t.textContent=k.hidden?'▸':'▾'}
    else if(t.dataset.retry){const p=+t.dataset.retry;drop(p);want(p)}
    else if(t.dataset.orig) openOrig(+t.dataset.orig,t,false);
    else if(t.dataset.dl) openOrig(+t.dataset.dl,t,true);
    else jump(+(t.dataset.p||t.dataset.goto));
  });
  $('#prev').onclick=()=>jump(CUR-1);$('#next').onclick=()=>jump(CUR+1);
  $('#pno').addEventListener('change',e=>jump(+e.target.value));
  $('#pno').addEventListener('focus',e=>e.target.select());
  const zoom=f=>{SCALE=Math.max(.5,Math.min(3,SCALE*f));const c=CUR;layoutWidth();jump(c)};
  $('#zi').onclick=()=>zoom(1.2);$('#zo').onclick=()=>zoom(1/1.2);
  $('#menu').onclick=()=>$('#app').classList.add('open');
  $('#scrim').onclick=()=>$('#app').classList.remove('open');
  $('#q').addEventListener('input',()=>{clearTimeout(qTimer);qTimer=setTimeout(runSearch,250)});
  let rz;new ResizeObserver(()=>{clearTimeout(rz);rz=setTimeout(()=>{if(REGMODE||!view.clientWidth) return;const c=CUR;layoutWidth();jump(c,true)},150)}).observe(view);
  addEventListener('hashchange',()=>{const h=/^#p=(\d+)$/.exec(location.hash);if(h&&+h[1]!==CUR) jump(+h[1],true)});
  addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    if(e.key==='ArrowRight'||e.key==='PageDown'&&e.altKey) {jump(CUR+1);e.preventDefault()}
    if(e.key==='ArrowLeft'||e.key==='PageUp'&&e.altKey) {jump(CUR-1);e.preventDefault()}
  });
}
